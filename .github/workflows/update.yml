 name: Update Game EventsCommit 

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Discover Wuwa official news
        run: python games/wuwa/wuwa_news_discovery.py

      - name: Test all four Wuwa categories
        run: python games/wuwa/wuwa_four_probe.py

      - name: Discover Wuwa news API
        run: python games/wuwa/wuwa_js_api_probe.py

      - name: Inspect Wuwa API details
        run: python games/wuwa/wuwa_api_detail_probe.py

      - name: Discover Wuwa official JSON
        run: python games/wuwa/wuwa_json_discovery.py

      - name: Test Wuwa Japanese and English JSON
        run: python games/wuwa/wuwa_json_locale_probe.py

      - name: Test Wuwa four article categories
        run: python games/wuwa/wuwa_four_article_probe.py

      - name: Preview Wuwa official imports
        run: python games/wuwa/wuwa_auto_import.py

      - name: Preview Wuwa official imports V2
        run: python games/wuwa/wuwa_auto_import_v2.py

      - name: Test Wuwa periods V3
        run: python games/wuwa/wuwa_period_probe_v3.py

      - name: Preview Wuwa imports V4
        run: python games/wuwa/wuwa_auto_import_v4.py

      - name: Preview Wuwa imports V5
        run: python games/wuwa/wuwa_auto_import_v5.py

      - name: Probe Wuwa article bodies V6
        run: python games/wuwa/wuwa_body_probe_v6.py

      - name: Preview Wuwa safe imports V13
        run: python games/wuwa/wuwa_safe_import_v13.py

      - name: Check Wuwa event timezone V18
        run: python games/wuwa/wuwa_server_time_crosscheck_v18.py

      - name: Preview Wuwa server dates V19
        run: python games/wuwa/wuwa_server_date_preview_v19.py

      - name: Import Wuwa automatically V23
        run: python games/wuwa/wuwa_auto_runner_v23.py --apply

      - name: Discover Wuwa official articles V24
        run: python games/wuwa/wuwa_official_discovery_v24.py

      - name: Inspect Wuwa official articles V25
        run: python games/wuwa/wuwa_article_structure_v25.py

      - name: Preview Wuwa dynamic gacha V26
        run: python games/wuwa/wuwa_dynamic_gacha_preview_v26.py

      - name: Preview Wuwa dynamic gacha V27
        run: python games/wuwa/wuwa_dynamic_gacha_preview_v27.py

      - name: Preview Wuwa dynamic gacha V28
        run: python games/wuwa/wuwa_dynamic_gacha_preview_v28.py

      - name: Import Wuwa gacha V29
        run: python games/wuwa/wuwa_dynamic_gacha_import_v29.py --apply

      - name: Crosscheck Wuwa gacha V30
        run: python games/wuwa/wuwa_official_start_crosscheck_v30.py

      - name: Crosscheck Wuwa gacha V31
        run: python games/wuwa/wuwa_official_broad_crosscheck_v31.py

      - name: Probe Wuwa official schedules V32
        run: python games/wuwa/wuwa_official_schedule_probe_v32.py

      - name: Preview Wuwa Wiki schedules V33
        run: python games/wuwa/wuwa_wiki_schedule_preview_v33.py

      - name: Preview Wuwa Wiki merge V34
        run: python games/wuwa/wuwa_wiki_official_merge_preview_v34.py

      - name: Preview Wuwa Wiki merge V35
        run: python games/wuwa/wuwa_wiki_merge_preview_v35.py

      - name: Import Wuwa Wiki auto V37
        run: python games/wuwa/wuwa_wiki_auto_runner_v37.py --apply

      - name: Preview Wuwa Wiki auto V38
        run: python games/wuwa/wuwa_wiki_auto_runner_v38.py

      - name: Preview ZZZ official events
        run: python games/zzz/zzz_preview.py

      - name: Import ZZZ official events
        run: python games/zzz/zzz_import.py --apply --clean-duplicates

      - name: Preview ZZZ challenges and maintenance
        run: python games/zzz/zzz_challenge_maintenance_probe.py

      - name: Import ZZZ maintenance
        run: python games/zzz/zzz_maintenance_import.py --apply

      - name: Preview ZZZ challenge rotations
        run: python games/zzz/zzz_challenge_preview.py

      - name: Import ZZZ challenges
        run: python games/zzz/zzz_challenge_import.py --apply

      - name: Find ZZZ official challenge dates
        run: python games/zzz/zzz_challenge_official_probe.py

      - name: Find ZZZ challenge schedules
        run: python games/zzz/zzz_challenge_schedule_probe.py

      - name: Import ZZZ predicted challenges
        run: python games/zzz/zzz_challenge_prediction_import.py --apply

      - name: Preview Genshin maintenance
        run: python games/genshin/genshin_maintenance_auto_import.py

      - name: Import Genshin maintenance
        run: python games/genshin/genshin_all_import.py --apply

      - name: Preview Genshin events and wishes
        run: python games/genshin/genshin_extra_preview.py

      - name: Import Genshin events and wishes
        run: python games/genshin/genshin_extra_import.py --apply

      - name: Test Japanese Wiki
        run: python games/hsr/wiki_hsr_preview.py

      - name: Update events
        run: python update_events.py

      - name: Import Japanese HSR Wiki
        run: python games/hsr/wiki_hsr_import.py

      - name: Import HSR Gacha
        run: python games/hsr/wiki_hsr_gacha.py   
        
      - name: Apply reviewed HSR gacha times
        run: python games/hsr/hsr_official_gacha_apply.py --apply
        
      - name: Remove duplicate HSR gacha
        run: python games/hsr/hsr_gacha_dedupe.py --apply
        
      - name: Test official HSR article dates
        run: python games/hsr/hsr_official_article_test.py
  
      - name: Extract official HSR event candidates
        run: python games/hsr/hsr_official_candidates.py
        
      - name: Match official HSR events
        run: python games/hsr/hsr_official_match_preview.py
        
      - name: Preview Asia-server HSR times
        run: python games/hsr/hsr_official_asia_preview.py
        
      - name: Apply official HSR Asia times
        run: python games/hsr/hsr_official_asia_apply.py
        
      - name: Check HSR relic event timezones
        run: python games/hsr/hsr_realm_timezone_check.py
        
      - name: Check HSR Phase II official gacha
        run: python games/hsr/hsr_phase2_official_check_v3.py
        
      - name: Preview official HSR gacha
        run: python games/hsr/hsr_official_gacha_preview.py
        
      - name: Check official HSR gacha names
        run: python games/hsr/hsr_official_gacha_name_check.py
        
      - name: Apply reviewed official HSR event dates and labels
        run: python games/hsr/hsr_official_import.py

      - name: Preview official HSR maintenance
        run: python games/hsr/hsr_maintenance_preview.py

      - name: Test HSR news API
        run: python games/hsr/hsr_maintenance_api_probe.py

      - name: Test HSR maintenance article details
        run: python games/hsr/hsr_maintenance_detail_probe.py

      - name: Import HSR maintenance
        run: python games/hsr/hsr_maintenance_import.py

      - name: Test HSR maintenance auto import
        run: python games/hsr/test_hsr_maintenance_auto_import.py

      - name: Auto-import HSR maintenance
        run: python games/hsr/hsr_maintenance_auto_import.py --apply
        
      - name: Diagnose HSR maintenance article structure
        run: python games/hsr/hsr_maintenance_structure_probe.py

      - name: Preview HSR maintenance times
        run: python games/hsr/hsr_maintenance_time_preview.py

      - name: Preview HSR structured maintenance content
        run: python games/hsr/hsr_maintenance_structured_preview.py

      - name: Final ZZZ duplicate cleanup
        run: python games/zzz/zzz_final_dedupe.py --apply

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add events.json
          if ! git diff --cached --quiet; then
            git commit -m "Auto-update game events"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
