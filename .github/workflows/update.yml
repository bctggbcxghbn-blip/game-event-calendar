name: Update Game Events
 
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: game-events-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test Wuwa Wiki importer V45 (offline)
        run: python -m unittest discover -s games/wuwa -p 'test_wuwa_wiki_v45.py' -v

      - name: Import Wuwa automatically V23
        run: python games/wuwa/wuwa_auto_runner_v23.py --apply

      - name: Import Wuwa gacha V29
        run: python games/wuwa/wuwa_dynamic_gacha_import_v29.py --apply

      - name: Restore Wuwa Wiki cache
        uses: actions/cache@v4
        with:
          path: .cache/wuwa-wiki
          key: wuwa-wiki-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            wuwa-wiki-${{ runner.os }}-

      - name: Import Wuwa Wiki auto V44
        id: wuwa_wiki
        run: python games/wuwa/wuwa_wiki_auto_runner_v44.py --apply

      - name: Upload Wuwa Wiki monitoring report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wuwa-wiki-v44-report
          path: .reports/wuwa-v44/
          if-no-files-found: warn
          retention-days: 14

      - name: Import Endfield Danqingdu V72
        run: python games/endfield/import_v72.py --apply

      - name: Test Endfield V74 audit (offline)
        run: python -m unittest discover -s tests -p 'test_endfield_v74.py' -v

      - name: Audit Endfield V73 candidates V74 (read-only)
        run: python games/endfield/audit_v74.py

      - name: Upload Endfield V74 audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: endfield-audit-v74
          path: .reports/endfield-v74/
          if-no-files-found: warn
          retention-days: 14

      - name: Test Endfield V75 (offline)
        run: python -m unittest discover -s tests -p 'test_endfield_v75.py' -v

      - name: Import Endfield verified end dates V75
        run: python games/endfield/import_v75.py --apply

      - name: Upload Endfield V75 review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: endfield-review-v75
          path: .reports/endfield-v75/
          if-no-files-found: warn
          retention-days: 14

      - name: Test Endfield V76 (offline)
        run: python -m unittest discover -s tests -p 'test_endfield_v76.py' -v

      - name: Monitor Endfield official end dates V76 (read-only)
        run: python games/endfield/monitor_v76.py

      - name: Upload Endfield V76 review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: endfield-enddate-review-v76
          path: .reports/endfield-v76/
          if-no-files-found: warn
          retention-days: 14

      - name: Test Endfield V77 (offline)
        run: python -m unittest discover -s tests -p 'test_endfield_v77.py' -v

      - name: Monitor Endfield official news V77 (read-only)
        run: python games/endfield/monitor_v77.py

      - name: Upload Endfield V77 review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: endfield-news-review-v77
          path: .reports/endfield-v77/
          if-no-files-found: warn
          retention-days: 14

      - name: Test Endfield V78 (offline)
        run: python -m unittest discover -s tests -p 'test_endfield_v78.py' -v

      - name: Diagnose Endfield news discovery V78 (read-only)
        run: python games/endfield/diagnose_v78.py

      - name: Upload Endfield V78 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: endfield-discovery-diagnostics-v78
          path: .reports/endfield-v78/
          if-no-files-found: warn
          retention-days: 14

      - name: Test Endfield V79 (offline)
        run: python -m unittest discover -s tests -p 'test_endfield_v79.py' -v

      - name: Diagnose Endfield JS news endpoints V79 (read-only)
        run: python games/endfield/diagnose_v79.py

      - name: Upload Endfield V79 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: endfield-js-diagnostics-v79
          path: .reports/endfield-v79/
          if-no-files-found: warn
          retention-days: 14

      - name: Test Endfield V80 (offline)
        run: python -m unittest discover -s tests -p 'test_endfield_v80.py' -v

      - name: Diagnose Endfield CDN JS V80 (read-only)
        run: python games/endfield/diagnose_v80.py

      - name: Upload Endfield V80 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: endfield-cdn-js-v80
          path: .reports/endfield-v80/
          if-no-files-found: warn
          retention-days: 14

      - name: Test Endfield V81 (offline)
        run: python -m unittest discover -s tests -p 'test_endfield_v81.py' -v

      - name: Diagnose Endfield bulletin API V81 (read-only)
        run: python games/endfield/diagnose_v81.py

      - name: Upload Endfield V81 API diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: endfield-api-diagnostics-v81
          path: .reports/endfield-v81/
          if-no-files-found: warn
          retention-days: 14

      - name: Test Endfield V82 (offline)
        run: python -m unittest discover -s tests -p 'test_endfield_v82.py' -v

      - name: Diagnose Endfield CMS config V82 (read-only)
        run: python games/endfield/diagnose_v82.py

      - name: Upload Endfield V82 CMS diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: endfield-cms-diagnostics-v82
          path: .reports/endfield-v82/
          if-no-files-found: warn
          retention-days: 14

      - name: Test Endfield V83 (offline)
        run: python -m unittest discover -s tests -p 'test_endfield_v83.py' -v

      - name: Diagnose Endfield config module V83 (read-only)
        run: python games/endfield/diagnose_v83.py

      - name: Upload Endfield V83 config diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: endfield-config-module-v83
          path: .reports/endfield-v83/
          if-no-files-found: warn
          retention-days: 14

      - name: Import ZZZ official events
        run: python games/zzz/zzz_import.py --apply --clean-duplicates

      - name: Import ZZZ maintenance
        run: python games/zzz/zzz_maintenance_import.py --apply

      - name: Import ZZZ challenges
        run: python games/zzz/zzz_challenge_import.py --apply

      - name: Import Genshin maintenance
        run: python games/genshin/genshin_all_import.py --apply

      - name: Import Genshin events and wishes
        run: python games/genshin/genshin_extra_import.py --apply

      - name: Update events
        run: python update_events.py

      - name: Test NTE official Ver.1.4 V59 (offline)
        run: python -m unittest discover -s tests -p 'test_nte_v59.py' -v

      - name: Import NTE official Ver.1.4 V59
        run: python games/nte/nte_official_v59.py --apply

      - name: Import Japanese HSR Wiki
        run: python games/hsr/wiki_hsr_import.py

      - name: Import HSR Gacha
        run: python games/hsr/wiki_hsr_gacha.py

      - name: Apply reviewed HSR gacha times
        run: python games/hsr/hsr_official_gacha_apply.py --apply

      - name: Remove duplicate HSR gacha
        run: python games/hsr/hsr_gacha_dedupe.py --apply

      - name: Apply official HSR Asia times
        run: python games/hsr/hsr_official_asia_apply.py

      - name: Apply reviewed official HSR event dates and labels
        run: python games/hsr/hsr_official_import.py

      - name: Import HSR maintenance
        run: python games/hsr/hsr_maintenance_import.py

      - name: Auto-import HSR maintenance
        run: python games/hsr/hsr_maintenance_auto_import.py --apply

      - name: Final ZZZ duplicate cleanup
        run: python games/zzz/zzz_final_dedupe.py --apply

      - name: Validate calendar display data V46 (offline)
        run: python -m unittest discover -s tests -p 'test_calendar_v46.py' -v

      - name: Test calendar quality V47 (offline)
        run: python -m unittest discover -s tests -p 'test_calendar_v47.py' -v

      - name: Audit calendar quality V47
        run: python tests/calendar_quality_v47.py

      - name: Upload calendar quality V47 report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calendar-quality-v47
          path: .reports/calendar-v47/
          if-no-files-found: warn
          retention-days: 14

      - name: Test verified calendar translations V53 (offline)
        run: python -m unittest discover -s tests -p 'test_calendar_v53.py' -v

      - name: Test verified calendar translations V52 (offline)
        run: python -m unittest discover -s tests -p 'test_calendar_v52.py' -v

      - name: Test verified calendar translations V51 (offline)
        run: python -m unittest discover -s tests -p 'test_calendar_v51.py' -v

      - name: Test verified calendar translations V50 (offline)
        run: python -m unittest discover -s tests -p 'test_calendar_v50.py' -v

      - name: Test verified calendar translations V49 (offline)
        run: python -m unittest discover -s tests -p 'test_calendar_v49.py' -v

      - name: Test calendar translation V48 (offline)
        run: python -m unittest discover -s tests -p 'test_calendar_v48.py' -v

      - name: Export unverified English names V48
        run: python tests/calendar_translation_v48.py

      - name: Upload calendar translation V48 candidates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calendar-translation-v48
          path: .reports/calendar-v48/
          if-no-files-found: warn
          retention-days: 14

      - name: Test Wuwa safe source deduplication V55 (offline)
        run: python -m unittest discover -s games/wuwa -p 'test_wuwa_final_dedupe_v55.py' -v

      - name: Final Wuwa source deduplication V55
        run: python games/wuwa/wuwa_final_dedupe_v55.py --apply

      - name: Test calendar display deduplication V54 (offline)
        run: python -m unittest discover -s tests -p 'test_calendar_v54.py' -v

      - name: Audit translated display duplicates V54 (read-only)
        run: python tests/calendar_dedupe_v54.py

      - name: Test calendar update quality V56 (offline)
        run: python -m unittest discover -s tests -p 'test_calendar_v56.py' -v

      - name: Audit calendar update quality V56 (read-only)
        run: python tests/calendar_update_audit_v56.py --strict

      - name: Upload calendar update quality V56 report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calendar-update-quality-v56
          path: .reports/calendar-v56/
          if-no-files-found: warn
          retention-days: 14

      - name: Test calendar update monitoring V57 (offline)
        run: python -m unittest discover -s tests -p 'test_calendar_v57.py' -v

      - name: Monitor calendar update V57 (read-only)
        run: python tests/calendar_update_monitor_v57.py --strict

      - name: Upload calendar update monitoring V57 report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calendar-update-monitor-v57
          path: .reports/calendar-v57/
          if-no-files-found: warn
          retention-days: 14

      - name: Test calendar Actions summary V58 (offline)
        run: python -m unittest discover -s tests -p 'test_calendar_v58.py' -v

      - name: Publish calendar Actions summary V58
        if: always()
        run: python tests/calendar_summary_v58.py

      - name: Upload calendar Actions summary V58
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calendar-actions-summary-v58
          path: .reports/calendar-v58/
          if-no-files-found: warn
          retention-days: 14

      - name: Test NTE official update discovery V60 (offline)
        run: python -m unittest discover -s tests -p 'test_nte_v60.py' -v

      - name: Discover NTE official updates V60 (read-only)
        run: python games/nte/nte_discover_v60.py

      - name: Upload NTE discovery V60 report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nte-official-discovery-v60
          path: .reports/nte-v60/
          if-no-files-found: warn
          retention-days: 14

      - name: Test NTE official article preview V61 (offline)
        run: python -m unittest discover -s tests -p 'test_nte_v61.py' -v

      - name: Preview NTE official article V61 (read-only)
        run: python games/nte/nte_article_preview_v61.py

      - name: Upload NTE article preview V61 report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nte-article-preview-v61
          path: .reports/nte-v61/
          if-no-files-found: warn
          retention-days: 14

      - name: Test NTE candidate review V62 (offline)
        run: python -m unittest discover -s tests -p 'test_nte_v62.py' -v

      - name: Review NTE V61 candidates V62 (read-only)
        run: python games/nte/nte_review_v62.py

      - name: Upload NTE review V62 report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nte-candidate-review-v62
          path: .reports/nte-v62/
          if-no-files-found: warn
          retention-days: 14

      - name: Test NTE Hunter Pass V67 (offline)
        run: python -m unittest discover -s tests -p 'test_nte_v67.py' -v

      - name: Import NTE Hunter Pass V67
        run: python games/nte/nte_v67_add_hunter.py --apply

      - name: Test NTE official discovery V68 (offline)
        run: python -m unittest discover -s tests -p 'test_nte_v68.py' -v

      - name: Discover NTE official articles V68 (read-only)
        run: python games/nte/nte_discover_v68.py

      - name: Upload NTE V68 candidate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nte-official-candidates-v68
          path: .reports/nte-v68/
          if-no-files-found: warn
          retention-days: 14

      - name: Test NTE approved importer V71 (offline)
        run: python -m unittest discover -s tests -p 'test_nte_v71.py' -v

      - name: Import reviewed NTE events V71
        run: python games/nte/nte_import_v71.py --apply

      - name: Upload NTE V71 review report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nte-review-v71
          path: .reports/nte-v71/
          if-no-files-found: warn
          retention-days: 14

      - name: Test Endfield discovery V73 (offline)
        run: python -m unittest discover -s tests -p 'test_endfield_v73.py' -v

      - name: Discover Endfield official news V73 (read-only)
        run: python games/endfield/discover_v73.py

      - name: Upload Endfield V73 candidate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: endfield-candidates-v73
          path: reports/endfield-v73-candidates.json
          if-no-files-found: warn
          retention-days: 14

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add events.json
          if ! git diff --cached --quiet; then
            git commit -m "Auto-update game events"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
