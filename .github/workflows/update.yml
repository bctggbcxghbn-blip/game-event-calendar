name: Update Game Events
 
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: game-events-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test Wuwa Wiki importer V45 (offline)
        run: python -m unittest discover -s games/wuwa -p 'test_wuwa_wiki_v45.py' -v

      - name: Import Wuwa automatically V23
        run: python games/wuwa/wuwa_auto_runner_v23.py --apply

      - name: Import Wuwa gacha V29
        run: python games/wuwa/wuwa_dynamic_gacha_import_v29.py --apply

      - name: Restore Wuwa Wiki cache
        uses: actions/cache@v4
        with:
          path: .cache/wuwa-wiki
          key: wuwa-wiki-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            wuwa-wiki-${{ runner.os }}-

      - name: Import Wuwa Wiki auto V44
        id: wuwa_wiki
        run: python games/wuwa/wuwa_wiki_auto_runner_v44.py --apply

      - name: Upload Wuwa Wiki monitoring report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wuwa-wiki-v44-report
          path: .reports/wuwa-v44/
          if-no-files-found: warn
          retention-days: 14

      - name: Import ZZZ official events
        run: python games/zzz/zzz_import.py --apply --clean-duplicates

      - name: Import ZZZ maintenance
        run: python games/zzz/zzz_maintenance_import.py --apply

      - name: Import ZZZ challenges
        run: python games/zzz/zzz_challenge_import.py --apply

      - name: Import Genshin maintenance
        run: python games/genshin/genshin_all_import.py --apply

      - name: Import Genshin events and wishes
        run: python games/genshin/genshin_extra_import.py --apply

      - name: Update events
        run: python update_events.py

      - name: Import Japanese HSR Wiki
        run: python games/hsr/wiki_hsr_import.py

      - name: Import HSR Gacha
        run: python games/hsr/wiki_hsr_gacha.py

      - name: Apply reviewed HSR gacha times
        run: python games/hsr/hsr_official_gacha_apply.py --apply

      - name: Remove duplicate HSR gacha
        run: python games/hsr/hsr_gacha_dedupe.py --apply

      - name: Apply official HSR Asia times
        run: python games/hsr/hsr_official_asia_apply.py

      - name: Apply reviewed official HSR event dates and labels
        run: python games/hsr/hsr_official_import.py

      - name: Import HSR maintenance
        run: python games/hsr/hsr_maintenance_import.py

      - name: Auto-import HSR maintenance
        run: python games/hsr/hsr_maintenance_auto_import.py --apply

      - name: Final ZZZ duplicate cleanup
        run: python games/zzz/zzz_final_dedupe.py --apply

      - name: Validate calendar display data V46 (offline)
        run: python -m unittest discover -s tests -p 'test_calendar_v46.py' -v

      - name: Test calendar quality V47 (offline)
        run: python -m unittest discover -s tests -p 'test_calendar_v47.py' -v

      - name: Audit calendar quality V47
        run: python tests/calendar_quality_v47.py

      - name: Upload calendar quality V47 report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calendar-quality-v47
          path: .reports/calendar-v47/
          if-no-files-found: warn
          retention-days: 14

      - name: Test verified calendar translations V53 (offline)
        run: python -m unittest discover -s tests -p 'test_calendar_v53.py' -v

      - name: Test verified calendar translations V52 (offline)
        run: python -m unittest discover -s tests -p 'test_calendar_v52.py' -v

      - name: Test verified calendar translations V51 (offline)
        run: python -m unittest discover -s tests -p 'test_calendar_v51.py' -v

      - name: Test verified calendar translations V50 (offline)
        run: python -m unittest discover -s tests -p 'test_calendar_v50.py' -v

      - name: Test verified calendar translations V49 (offline)
        run: python -m unittest discover -s tests -p 'test_calendar_v49.py' -v

      - name: Test calendar translation V48 (offline)
        run: python -m unittest discover -s tests -p 'test_calendar_v48.py' -v

      - name: Export unverified English names V48
        run: python tests/calendar_translation_v48.py

      - name: Upload calendar translation V48 candidates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calendar-translation-v48
          path: .reports/calendar-v48/
          if-no-files-found: warn
          retention-days: 14

      - name: Test Wuwa safe source deduplication V55 (offline)
        run: python -m unittest discover -s games/wuwa -p 'test_wuwa_final_dedupe_v55.py' -v

      - name: Final Wuwa source deduplication V55
        run: python games/wuwa/wuwa_final_dedupe_v55.py --apply

      - name: Test calendar display deduplication V54 (offline)
        run: python -m unittest discover -s tests -p 'test_calendar_v54.py' -v

      - name: Audit translated display duplicates V54 (read-only)
        run: python tests/calendar_dedupe_v54.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add events.json
          if ! git diff --cached --quiet; then
            git commit -m "Auto-update game events"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
