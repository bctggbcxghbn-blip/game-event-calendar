name: Update Game Events

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
     
      - name: Test Japanese Wiki
        run: python wiki_hsr_preview.py
      - name: Update events
        run: python update_events.py
        
      - name: Import Japanese HSR Wiki
        run: python wiki_hsr_import.py
        
      - name: Import HSR Gacha
 　　　　run: python wiki_hsr_gacha.py
     
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add events.json
          if ! git diff --cached --quiet; then
            git commit -m "Auto-update game events"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
