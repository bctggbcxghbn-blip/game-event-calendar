name: Update Game Events

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test Japanese Wiki
        run: python wiki_hsr_preview.py

      - name: Update events
        run: python update_events.py

      - name: Import Japanese HSR Wiki
        run: python wiki_hsr_import.py

      - name: Import HSR Gacha
        run: python wiki_hsr_gacha.py   
        
      - name: Apply reviewed HSR gacha times
        run: python hsr_official_gacha_apply.py --apply
        
      - name: Test official HSR article dates
        run: python hsr_official_article_test.py
  
      - name: Extract official HSR event candidates
        run: python hsr_official_candidates.py
        
      - name: Match official HSR events
        run: python hsr_official_match_preview.py
        
      - name: Preview Asia-server HSR times
        run: python hsr_official_asia_preview.py
        
      - name: Apply official HSR Asia times
        run: python hsr_official_asia_apply.py
        
      - name: Check HSR relic event timezones
        run: python hsr_realm_timezone_check.py

      - name: Preview official HSR gacha
        run: python hsr_official_gacha_preview.py
        
      - name: Check official HSR gacha names
        run: python hsr_official_gacha_name_check.py
        
      - name: Apply reviewed official HSR event dates and labels
        run: python hsr_official_import.py


      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add events.json
          if ! git diff --cached --quiet; then
            git commit -m "Auto-update game events"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
