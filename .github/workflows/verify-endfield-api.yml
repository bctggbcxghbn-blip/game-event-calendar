name: Verify Endfield Official API

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run read-only Endfield API audit
        continue-on-error: true
        run: python -m tools.verify_endfield_api
      - name: Run existing Python tests
        run: python -m unittest discover -s tests
      - name: Upload Endfield API audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: endfield-api-audit
          path: artifacts/endfield-api-audit/report.json
          if-no-files-found: warn
          retention-days: 14
