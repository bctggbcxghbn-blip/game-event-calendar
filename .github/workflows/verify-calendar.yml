name: Verify Calendar (no publishing)

on:
  push:
    branches:
      - 'codex/verify-calendar-*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/codex/verify-calendar-')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run HSR review badge tests
        env:
          PYTHONPATH: ${{ github.workspace }}
          PYTHONUTF8: '1'
          PYTHONIOENCODING: utf-8
        run: python -m unittest discover -s tests -p 'test_hsr_review_badge.py' -v
      - name: Run full offline test suite
        env:
          PYTHONPATH: ${{ github.workspace }}
          PYTHONUTF8: '1'
          PYTHONIOENCODING: utf-8
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Run quality audit (warnings are reported separately)
        env:
          PYTHONPATH: ${{ github.workspace }}
          PYTHONUTF8: '1'
          PYTHONIOENCODING: utf-8
        run: python tests/calendar_update_audit_v56.py --strict
      - name: Run offline tests and read-only quality audit
        run: python -B tools/verify_calendar.py --baseline origin/main ${{ github.event_name == 'pull_request' && '--allow-index-change' || '' }} --output "${{ runner.temp }}/calendar-verification.json"
      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calendar-verification
          path: ${{ runner.temp }}/calendar-verification.json
          if-no-files-found: error
          retention-days: 14
