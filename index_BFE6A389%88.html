<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>7ゲーム イベントスケジュール</title><style>
:root{--bg:#0e1923;--panel:#1e2d3d;--line:#2c4054;--text:#eff7ff;--muted:#8da8c6}*{box-sizing:border-box}body{margin:0;background:#0a1019;color:var(--text);font:13px system-ui,'Noto Sans JP',sans-serif}button,input{font:inherit}button{background:#1b2a39;color:inherit;border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer}button:hover{filter:brightness(1.2)}button.active{background:#17678c;border-color:#41b7ec}.wrap{max-width:1500px;margin:16px auto;padding:15px;border-radius:13px;background:var(--bg)}header,.controls,.filters,.games,.stats{display:flex;align-items:center;gap:7px;flex-wrap:wrap}header{justify-content:space-between}h1{font-size:17px;margin:0}.controls{margin-left:auto}.period{min-width:140px;text-align:center;font-weight:700}.filters,.games{margin:13px 0}.sub{color:var(--muted);font-size:10px;letter-spacing:1px}.filter{padding:4px 10px;border-radius:18px;font-size:11px;border-color:var(--c);color:var(--c);background:color-mix(in srgb,var(--c) 10%,transparent)}.filter.off{opacity:.3}.game{padding:5px 9px;font-size:11px;border-left:3px solid var(--c)}.game.off{opacity:.35}.timeline{border:1px solid var(--line);border-radius:11px;overflow:auto;background:var(--panel)}.canvas{min-width:760px;position:relative}.dates,.track{display:grid;grid-template-columns:repeat(var(--days),minmax(48px,1fr))}.dates{position:sticky;top:0;z-index:5;background:#1e2e40}.date{height:55px;text-align:center;padding:9px 0;border-right:1px solid var(--line);color:#87a8cc;font-size:11px}.date b{display:block;font-size:13px;margin-top:3px}.date.weekend{color:#f18a9b}.date.sat{color:#6aa6ff}.date.today{background:#32475e;color:#fff}.track{height:35px;border-top:1px solid #293a4b;position:relative;background:repeating-linear-gradient(to right,transparent 0,transparent calc(100% / var(--days) - 1px),#2b4052 calc(100% / var(--days) - 1px),#2b4052 calc(100% / var(--days)))}.bar{position:absolute;top:5px;height:25px;min-width:10px;border:2px solid var(--game-color,#fff);border-radius:5px;padding:2px 7px;display:flex;align-items:center;justify-content:space-between;gap:5px;overflow:hidden;white-space:nowrap;background:var(--c);color:white;text-align:left;font-weight:650;font-size:11px;z-index:2}.bar.segment{border-radius:3px}.bar span{overflow:hidden;text-overflow:ellipsis}.bar em{font-style:normal;font-size:10px;background:#0003;padding:2px 4px;border-radius:3px;flex-shrink:0}.todayline{position:absolute;top:55px;bottom:0;width:2px;background:#f28b83;z-index:3;pointer-events:none}.todayline:before{content:'';position:absolute;top:-4px;left:-3px;background:#f28b83;width:8px;height:8px;border-radius:50%}.stats{margin-top:10px}.stat{padding:11px;background:#192936;border:1px solid var(--line);border-radius:8px;color:var(--muted)}.stat strong{color:#4edb98;font-size:17px;margin-right:5px}.stat:nth-child(2) strong{color:#40bbff}.stat:nth-child(3) strong{color:#8299b3}.note{font-size:11px;color:var(--muted);margin:13px 0}.empty{padding:45px;text-align:center;color:var(--muted)}dialog{width:min(500px,94vw);border:1px solid #45617d;background:#172636;color:#fff;border-radius:12px;padding:20px}dialog::backdrop{background:#000a}dialog label{display:block;margin:12px 0}dialog input,dialog select{display:block;width:100%;padding:8px;margin-top:4px;background:#0d1a28;color:white;border:1px solid #45617d;border-radius:5px}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}a{color:#82cbff}.light{--bg:#eef4f9;--panel:#dce8f3;--line:#c1d0de;--text:#17283b;--muted:#526e88;background:#d9e5ef}.light .dates{background:#dce8f3}.light .stat{background:#e4eef7}.light button:not(.bar):not(.filter):not(.game){background:#d8e6f2;color:#17283b}.light .date.today{background:#b8d6ed}.light .track{background:repeating-linear-gradient(to right,transparent 0,transparent calc(100% / var(--days) - 1px),#c1d0de calc(100% / var(--days) - 1px),#c1d0de calc(100% / var(--days)))}@media(max-width:700px){.wrap{margin:0;padding:10px;border-radius:0}.controls{margin-left:0}header{align-items:flex-start}.period{min-width:100px}}
</style></head><body><main class="wrap" id="app"><header><h1>🗓️ イベントスケジュール</h1><div class="controls"><button id="theme" title="配色変更">🌗</button><button id="today">今日</button><button id="prev">◀</button><span id="period" class="period"></span><button id="next">▶</button><button id="two" class="active">2週</button><button id="month">月</button></div></header><div class="games" id="games"></div><div class="filters" id="filters"></div><section class="timeline"><div class="canvas" id="canvas"><div class="dates" id="dates"></div><div id="tracks"></div><div id="todayline" class="todayline" hidden></div></div></section><div class="stats" id="stats"></div><p class="note">イベントバーを押すと詳細を表示します。表示設定はこのブラウザに保存されます。取得元のデータが「イベント」扱いの場合、ガチャ等への分類は未確定です。</p></main><dialog id="dlg"><h2 id="detailTitle"></h2><p id="detailMeta"></p><p id="detailSource"></p><div class="actions"><button id="close">閉じる</button></div></dialog><script>
const G={genshin:['原神','#70ba86'],wuwa:['鳴潮','#55c5cb'],hsr:['スタレ','#d2a76b'],zzz:['ゼンゼロ','#db85a7'],nte:['NTE','#ad9be9'],arknights:['アークナイツ','#8db4d5'],endfield:['エンドフィールド','#e39b75']};
const T={event:['イベント','#d95791'],gacha:['ガチャ','#4db67c'],maintenance:['メンテナンス','#e4a83e'],story:['ストーリー','#a365cb'],challenge:['チャレンジ','#0bc4ce'],other:['その他','#8096b4']};
const $=id=>document.getElementById(id),day=86400000,fmt=d=>new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'}).format(d),parse=s=>new Date(s+'T12:00:00+09:00'),plus=(s,n)=>fmt(new Date(parse(s).getTime()+n*day)),diff=(a,b)=>Math.round((parse(a)-parse(b))/day),today=()=>fmt(new Date());
let prefs={};try{prefs=JSON.parse(localStorage.getItem('timelinePrefs')||'{}')}catch{}let start=prefs.start||plus(today(),-3),days=prefs.days===31?31:14,enabledGames=new Set(prefs.games||Object.keys(G)),enabledTypes=new Set(prefs.types||Object.keys(T)),light=!!prefs.light,events=[];
function persist(){localStorage.setItem('timelinePrefs',JSON.stringify({start,days,games:[...enabledGames],types:[...enabledTypes],light}))}
function type(e){const k=String(e.kind||'');if(/ガチャ|新キャラ|復刻キャラ|新武器|復刻武器|スカウト|祈願|跳躍|変調|集音/.test(k))return'gacha';if(/メンテ/.test(k))return'maintenance';if(/ストーリー|シナリオ/.test(k))return'story';if(/挑戦|チャレンジ|高難度/.test(k))return'challenge';if(/イベント|ログイン|報酬/.test(k))return'event';return'other'}
function barColor(e){const k=String(e.kind||'');if(/新キャラ/.test(k))return '#36b46b';if(/復刻キャラ/.test(k))return '#19844d';if(/武器・装備ガチャ|新武器|復刻武器|光円錐/.test(k))return '#20a6a0';return T[type(e)][1]}
function safe(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function challengeKey(e){
  if(type(e)!=='challenge')return null;
  const n=String(e.name||'');
  if(/虚構叙事/.test(n))return '虚構叙事';
  if(/混沌の記憶/.test(n))return '混沌の記憶';
  if(/末日の幻影/.test(n))return '末日の幻影';
  return n.replace(/(?:第[0-9０-９]+期|シーズン[0-9０-９]+)$/,'').trim();
}
function displayItems(list){
  // One lane for each challenge mode; newer seasons take priority from their start date.
  // Gacha items sharing the same period appear as one clickable bar.
  const gacha=new Map(),lanes=new Map(),ordinary=[];
  for(const e of list){
    if(type(e)==='gacha'){
      const key=e.game+'|'+e.start+'|'+e.end;
      if(!gacha.has(key))gacha.set(key,[]);
      gacha.get(key).push(e);
    }else if(challengeKey(e)){
      const key=e.game+'|'+challengeKey(e);
      if(!lanes.has(key))lanes.set(key,[]);
      lanes.get(key).push(e);
    }else ordinary.push({key:'single:'+e.id,segments:[{...e,displayStart:e.start,displayEnd:e.end}]});
  }
  for(const [key,items] of gacha){
    const first=items[0];
    const names=[...new Set(items.map(e=>e.name))];
    ordinary.push({key:'gacha:'+key,segments:[{...first,name:names.join(' / '),displayStart:first.start,displayEnd:first.end,groupItems:items}]});
  }
  for(const [key,items] of lanes){
    items.sort((a,b)=>a.start.localeCompare(b.start)||a.end.localeCompare(b.end));
    const segments=[];
    for(let i=0;i<items.length;i++){
      const e=items[i],next=items[i+1];
      const displayEnd=next&&next.start<=e.end?plus(next.start,-1):e.end;
      if(displayEnd>=e.start)segments.push({...e,displayStart:e.start,displayEnd});
    }
    ordinary.push({key:'challenge:'+key,segments});
  }
  return ordinary.filter(l=>l.segments.some(e=>e.displayStart<=plus(start,days-1)&&e.displayEnd>=start))
    .sort((a,b)=>type(a.segments[0]).localeCompare(type(b.segments[0]))||a.segments[0].displayEnd.localeCompare(b.segments[0].displayEnd));
}
let detailItems=new Map();
function render(){
  persist();$('app').classList.toggle('light',light);
  $('two').classList.toggle('active',days===14);$('month').classList.toggle('active',days===31);
  let end=plus(start,days-1),t=today();
  $('period').textContent=start.slice(5).replace('-','/')+' – '+end.slice(5).replace('-','/');
  $('games').innerHTML=Object.entries(G).map(([k,v])=>`<button class="game ${enabledGames.has(k)?'':'off'}" data-game="${k}" style="--c:${v[1]}">${v[0]}</button>`).join('');
  $('filters').innerHTML='<span class="sub">FILTER</span>'+Object.entries(T).map(([k,v])=>`<button class="filter ${enabledTypes.has(k)?'':'off'}" data-type="${k}" style="--c:${v[1]}">● ${v[0]}</button>`).join('');
  $('canvas').style.setProperty('--days',days);
  $('dates').innerHTML=Array.from({length:days},(_,i)=>{let s=plus(start,i),d=parse(s),w=d.getDay();return `<div class="date ${w===0?'weekend':w===6?'sat':''} ${s===t?'today':''}">${'日月火水木金土'[w]}<b>${Number(s.slice(8))}</b></div>`}).join('');
  const visible=events.filter(e=>enabledGames.has(e.game)&&enabledTypes.has(type(e))&&e.start<=end&&e.end>=start);
  const lanes=displayItems(visible);detailItems=new Map();
  $('tracks').innerHTML=lanes.length?lanes.map(lane=>'<div class="track">'+lane.segments.filter(e=>e.displayStart<=end&&e.displayEnd>=start).map(e=>{
    const l=Math.max(0,diff(e.displayStart,start)),r=Math.min(days-1,diff(e.displayEnd,start)),w=r-l+1;
    const remain=diff(e.displayEnd,t),badge=remain>=0&&remain<=7?`<em>あと${remain}日</em>`:'';
    const id=e.id+'|'+e.displayStart+'|'+e.displayEnd;
    detailItems.set(id,e);
    const title=G[e.game][0]+'｜'+e.name;
    return `<button class="bar segment" data-id="${safe(id)}" style="--c:${barColor(e)};--game-color:${G[e.game][1]};left:${l/days*100}%;width:${w/days*100}%" title="${safe(title)}"><span>${safe(e.name)}</span>${badge}</button>`;
  }).join('')+'</div>').join(''):'<div class="empty">この期間に表示するイベントはありません</div>';
  $('todayline').hidden=!(t>=start&&t<=end&&lanes.length);
  $('todayline').style.left=(diff(t,start)+.5)/days*100+'%';
  const active=visible.filter(e=>e.start<=t&&e.end>=t).length,upcoming=visible.filter(e=>e.start>t).length,ended=visible.filter(e=>e.end<t).length;
  $('stats').innerHTML=`<div class="stat"><strong>${active}</strong>開催中</div><div class="stat"><strong>${upcoming}</strong>開催予定</div><div class="stat"><strong>${ended}</strong>終了</div>`;
}
$('prev').onclick=()=>{start=plus(start,-days);render()};$('next').onclick=()=>{start=plus(start,days);render()};$('today').onclick=()=>{start=plus(today(),-3);render()};$('two').onclick=()=>{days=14;render()};$('month').onclick=()=>{days=31;render()};$('theme').onclick=()=>{light=!light;render()};$('games').onclick=e=>{let b=e.target.closest('[data-game]');if(!b)return;let k=b.dataset.game;enabledGames.has(k)?enabledGames.delete(k):enabledGames.add(k);render()};$('filters').onclick=e=>{let b=e.target.closest('[data-type]');if(!b)return;let k=b.dataset.type;enabledTypes.has(k)?enabledTypes.delete(k):enabledTypes.add(k);render()};$('tracks').onclick=e=>{let b=e.target.closest('[data-id]');if(!b)return;let item=detailItems.get(b.dataset.id);if(!item)return;$('detailTitle').textContent=item.name;$('detailMeta').textContent=`${G[item.game][0]} / ${item.kind||'イベント'} / ${item.displayStart} ～ ${item.displayEnd}`;$('detailSource').innerHTML=item.url&&/^https:\/\//.test(item.url)?`<a href="${safe(item.url)}" target="_blank" rel="noopener noreferrer">情報元を開く ↗</a>`:'情報元URLは登録されていません';$('dlg').showModal()};$('close').onclick=()=>$('dlg').close();
async function load(){let data=[];try{let r=await fetch('./events.json?t='+Date.now(),{cache:'no-store'});if(r.ok){let j=await r.json();if(Array.isArray(j))data=j}}catch(e){console.warn(e)}let saved=[];try{saved=JSON.parse(localStorage.getItem('sevenGameEvents')||localStorage.getItem('fourGameEvents')||'[]')}catch{}let map=new Map();for(let e of [...saved,...data])if(e&&G[e.game]&&e.name&&/^\d{4}-\d\d-\d\d$/.test(e.start)&&/^\d{4}-\d\d-\d\d$/.test(e.end))map.set(e.id||`${e.game}:${e.name}:${e.start}`,e);events=[...map.values()];render()}render();load();
</script></body></html>
