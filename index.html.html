<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101425"><title>7ゲーム イベントカレンダー</title><style>
:root{color-scheme:dark;--bg:#0c1020;--panel:#171d31;--line:#303950;--text:#f2f5ff;--muted:#a5b0c9}*{box-sizing:border-box}body{margin:0;background:linear-gradient(140deg,#111a35,#0b1020 55%);font:14px system-ui,'Noto Sans JP',sans-serif;color:var(--text)}button,input,select{font:inherit}button{cursor:pointer;color:inherit;border:1px solid var(--line);background:#232b43;border-radius:11px;padding:9px 12px}button:hover{background:#34405f}button.active{background:#5969b8;border-color:#8493f5}.wrap{max-width:1200px;margin:auto;padding:22px 14px 60px}header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px}h1{font-size:clamp(21px,4vw,30px);margin:0}p{color:var(--muted)}.toolbar,.filters,.switch{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:17px 0}.toolbar input,.toolbar select,dialog input,dialog select{background:#11182b;color:white;border:1px solid var(--line);padding:10px;border-radius:9px}.filters button{border-left:4px solid var(--accent)}.month{font-size:22px;font-weight:750;min-width:140px;text-align:center}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.weekday{text-align:center;color:var(--muted);padding:9px 0}.day{background:var(--panel);border:1px solid var(--line);border-radius:10px;min-height:125px;padding:7px;overflow:hidden}.day.other{opacity:.28}.day.today{outline:2px solid #90a7ff}.dayhead{display:flex;justify-content:space-between;margin-bottom:6px;font-weight:700}.dayhead small{color:var(--muted)}.pill{display:block;text-align:left;width:100%;padding:5px 6px;margin:3px 0;border:0;border-left:3px solid var(--accent);border-radius:5px;background:color-mix(in srgb,var(--accent) 19%,#151a2a);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pill.done{text-decoration:line-through;opacity:.5}.more{font-size:11px;color:#b9c9ff}.events{display:grid;gap:10px}.event{background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:12px;padding:14px;display:flex;justify-content:space-between;gap:10px;align-items:center}.event strong{font-size:15px}.meta{color:var(--muted);font-size:12px;margin-top:5px}.stats{display:flex;gap:9px;flex-wrap:wrap}.stat{padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}dialog{background:#192139;color:white;border:1px solid #485574;border-radius:16px;width:min(94vw,480px);padding:22px}dialog::backdrop{background:#000a}dialog label{display:block;margin:12px 0 5px}dialog input,dialog select{width:100%}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.hint{font-size:12px;color:var(--muted)}.empty{padding:35px;text-align:center;color:var(--muted)}@media(max-width:650px){.wrap{padding:15px 8px}.calendar{gap:2px}.day{min-height:91px;padding:3px;border-radius:5px}.pill{font-size:9px;padding:3px 2px}.dayhead{font-size:12px}.dayhead small{display:none}.month{min-width:105px;font-size:19px}.event{align-items:flex-start}.toolbar{gap:5px}}
</style></head><body><div class="wrap"><header><div><h1>🎮 7ゲーム イベントカレンダー</h1><p>原神・鳴潮・スタレ・ゼンゼロ・NTE・アークナイツ・エンドフィールド</p></div><button id="add">＋ イベント追加</button></header><div class="stats" id="stats"></div><div class="toolbar"><button id="prev">‹</button><span class="month" id="month"></span><button id="next">›</button><button id="current">今月</button><button id="sept">2026年9月</button><span style="flex:1"></span><button id="calendarBtn" class="active">カレンダー</button><button id="listBtn">一覧</button></div><div class="filters" id="filters"></div><div class="toolbar"><input id="search" placeholder="🔎 イベントを検索" aria-label="イベント検索"><select id="category"><option value="all">全種類</option><option value="banner">新キャラ・復刻</option><option value="new">新キャラ</option><option value="rerun">復刻キャラ</option><option value="event">イベント・その他</option></select><select id="status"><option value="all">すべて</option><option value="active">開催中</option><option value="upcoming">今後開催</option><option value="ending">7日以内に終了</option><option value="incomplete">未完了</option></select><button id="export">データ書き出し</button><button id="import">読み込み</button><input id="file" type="file" accept="application/json" hidden></div><div id="main"></div><p class="hint">※ 新キャラ・復刻は「＋ イベント追加」から登録できます。未確認のガチャ日程は掲載していません。初期データは2026年9月の一部イベント。出典リンクで日付を確認できます。時刻は省略し日付単位で表示しています。保存先はこのブラウザ内です。異なる端末とは同期されません。</p></div><dialog id="dlg"><form id="form"><h2 id="dialogTitle">イベント</h2><input id="eid" type="hidden"><label>イベント名<input id="name" required maxlength="100"></label><label>ゲーム<select id="game"></select></label><label>開始日<input id="start" type="date" required></label><label>終了日<input id="end" type="date" required></label><label>種類<select id="kind"><option>イベント</option><option>報酬2倍</option><option>報酬3倍</option><option>ログイン</option><option>新キャラ</option><option>復刻キャラ</option><option>新武器・装備</option><option>復刻武器・装備</option><option>その他</option></select></label><label>情報元URL<input id="url" type="url" placeholder="https://..."></label><label><input id="done" type="checkbox" style="width:auto"> 完了済み</label><div class="actions"><button type="button" id="delete">削除</button><button type="button" id="cancel">キャンセル</button><button type="submit">保存</button></div></form></dialog><script>
const games={genshin:{name:'原神',color:'#73bc82'},wuwa:{name:'鳴潮',color:'#5ecbd5'},hsr:{name:'スタレ',color:'#e9b96d'},zzz:{name:'ゼンゼロ',color:'#e78bab'},nte:{name:'NTE',color:'#b3a1ff'},arknights:{name:'アークナイツ',color:'#f4ce62'},endfield:{name:'エンドフィールド',color:'#ed916b'}};
const initial=[
['wuwa','清らかな調べ、過ぎゆく歳月を記す','2026-09-03','2026-09-21','イベント','https://gamewith.jp/wutheringwaves/574923'],
['wuwa','夢がまだ、響き続けているなら','2026-09-10','2026-09-29','イベント','https://gamewith.jp/wutheringwaves/575837'],
['hsr','次元界分裂','2026-09-07','2026-09-21','報酬2倍','https://gamewith.jp/houkaistarrail/article/show/578222'],
['hsr','2倍トンネル','2026-09-19','2026-09-28','報酬2倍','https://gamewith.jp/houkaistarrail/article/show/578222'],
['hsr','愛、幽霊とロボット','2026-09-28','2026-11-11','イベント','https://gamewith.jp/houkaistarrail/article/show/396226'],
['zzz','天使応援大作戦','2026-09-09','2026-11-30','イベント','https://gamewith.jp/zenless/456183'],
['zzz','弾けろ！ピンボールナイト！','2026-09-10','2026-10-19','イベント','https://gamewith.jp/zenless/456183'],
['zzz','バーチャルシャドウアリーナ','2026-09-16','2026-10-05','イベント','https://wikiwiki.jp/zenless/%E3%82%A4%E3%83%99%E3%83%B3%E3%83%88'],
['zzz','先遣賞金-区域防衛','2026-09-23','2026-09-28','報酬2倍','https://wikiwiki.jp/zenless/%E3%82%A4%E3%83%99%E3%83%B3%E3%83%88'],
['zzz','じゃーん！コロるん成長日記','2026-09-30','2026-10-19','イベント','https://gamewith.jp/zenless/456183'],
['zzz','棚から「ンナンナ」','2026-09-30','2026-10-20','ログイン','https://gamewith.jp/zenless/456183'],
['genshin','原神×サーティワン コラボ（ゲーム外）','2026-09-08','2026-10-06','その他','https://bestcalendar.jp/events/%E5%8E%9F%E7%A5%9E']
].map((a,i)=>({id:'seed'+i,game:a[0],name:a[1],start:a[2],end:a[3],kind:a[4],url:a[5],done:false}));
let events;try{const saved=JSON.parse(localStorage.getItem('sevenGameEvents')||localStorage.getItem('fourGameEvents'));events=Array.isArray(saved)?saved:initial}catch{events=initial}
let y=2026,m=8,view='calendar',enabled=new Set(Object.keys(games));const $=id=>document.getElementById(id);const today=()=>{const p=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());return p};const date=s=>new Date(s+'T12:00:00+09:00');const diff=(a,b)=>Math.round((date(a)-date(b))/86400000);const fmt=s=>s.slice(5).replace('-','/');const save=()=>{localStorage.setItem('sevenGameEvents',JSON.stringify(events));render()};const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const iso=(yy,mm,dd)=>`${yy}-${String(mm+1).padStart(2,'0')}-${String(dd).padStart(2,'0')}`;
function filtered(){const t=today(),q=$('search').value.toLowerCase(),s=$('status').value,c=$('category').value;return events.filter(e=>enabled.has(e.game)&&e.name.toLowerCase().includes(q)&&(c==='all'||c==='banner'&&['新キャラ','復刻キャラ'].includes(e.kind)||c==='new'&&e.kind==='新キャラ'||c==='rerun'&&e.kind==='復刻キャラ'||c==='event'&&!['新キャラ','復刻キャラ','新武器・装備','復刻武器・装備'].includes(e.kind))&&(s==='all'||s==='active'&&e.start<=t&&e.end>=t||s==='upcoming'&&e.start>t||s==='ending'&&diff(e.end,t)>=0&&diff(e.end,t)<=7||s==='incomplete'&&!e.done)).sort((a,b)=>a.start.localeCompare(b.start)||a.end.localeCompare(b.end))}
function chip(e){return `<button class="pill ${e.done?'done':''}" style="--accent:${games[e.game].color}" data-id="${esc(e.id)}" title="${esc(e.name)}">${e.kind==='新キャラ'?'✨ ':e.kind==='復刻キャラ'?'🔁 ':e.kind.includes('倍')?'⭐ ':''}${esc(e.name)}</button>`}
function render(){const es=filtered(),t=today();$('month').textContent=`${y}年${m+1}月`;$('filters').innerHTML=Object.entries(games).map(([id,g])=>`<button style="--accent:${g.color}" class="${enabled.has(id)?'active':''}" data-game="${id}">${g.name}</button>`).join('');$('stats').innerHTML=`<div class="stat">登録イベント <b>${events.length}</b></div><div class="stat">開催中 <b>${events.filter(e=>e.start<=t&&e.end>=t).length}</b></div><div class="stat">未完了 <b>${events.filter(e=>!e.done).length}</b></div>`;$('calendarBtn').classList.toggle('active',view==='calendar');$('listBtn').classList.toggle('active',view==='list');if(view==='list'){const monthStart=iso(y,m,1),monthEnd=iso(y,m+1,0);const shown=es.filter(e=>e.start<=monthEnd&&e.end>=monthStart);$('main').innerHTML=`<div class="events">${shown.map(e=>`<div class="event" style="--accent:${games[e.game].color}"><div><strong>${e.done?'✓ ':''}${esc(e.name)}</strong><div class="meta">${games[e.game].name} · ${e.kind} · ${fmt(e.start)}〜${fmt(e.end)} ${e.end>=t?' · 終了まで'+diff(e.end,t)+'日':''}</div></div><button data-id="${esc(e.id)}">詳細・編集</button></div>`).join('')||'<div class="empty">この月に該当するイベントはありません</div>'}</div>`;return}let first=new Date(y,m,1).getDay(),count=new Date(y,m+1,0).getDate(),html='<div class="calendar">';for(const w of ['日','月','火','水','木','金','土'])html+=`<div class="weekday">${w}</div>`;for(let i=0;i<Math.ceil((first+count)/7)*7;i++){let d=i-first+1,ds=iso(y,m,d),valid=d>=1&&d<=count,dayEvents=valid?es.filter(e=>e.start<=ds&&e.end>=ds):[];html+=`<div class="day ${valid?'':'other'} ${ds===t?'today':''}"><div class="dayhead">${valid?d:''}<small>${valid&&ds===t?'今日':''}</small></div>${dayEvents.slice(0,4).map(chip).join('')}${dayEvents.length>4?`<button class="more" data-day="${ds}">他${dayEvents.length-4}件</button>`:''}</div>`} $('main').innerHTML=html+'</div>'}
function edit(id){let e=events.find(x=>x.id===id);$('dialogTitle').textContent=e?'イベント詳細・編集':'イベント追加';$('eid').value=e?.id||'';$('name').value=e?.name||'';$('game').value=e?.game||'genshin';$('start').value=e?.start||iso(y,m,1);$('end').value=e?.end||iso(y,m,1);$('kind').value=e?.kind||'イベント';$('url').value=e?.url||'';$('done').checked=!!e?.done;$('delete').hidden=!e;$('dlg').showModal()}
$('game').innerHTML=Object.entries(games).map(([k,v])=>`<option value="${k}">${v.name}</option>`).join('');$('prev').onclick=()=>{m--;if(m<0){m=11;y--}render()};$('next').onclick=()=>{m++;if(m>11){m=0;y++}render()};$('current').onclick=()=>{const d=date(today());y=d.getFullYear();m=d.getMonth();render()};$('sept').onclick=()=>{y=2026;m=8;render()};$('calendarBtn').onclick=()=>{view='calendar';render()};$('listBtn').onclick=()=>{view='list';render()};$('add').onclick=()=>edit();$('cancel').onclick=()=>$('dlg').close();$('search').oninput=render;$('status').onchange=render;$('category').onchange=render;$('filters').onclick=e=>{const b=e.target.closest('[data-game]');if(!b)return;enabled.has(b.dataset.game)?enabled.delete(b.dataset.game):enabled.add(b.dataset.game);render()};$('main').onclick=e=>{let b=e.target.closest('[data-id]');if(b){edit(b.dataset.id);return}let day=e.target.closest('[data-day]');if(day){view='list';$('search').value='';render();alert('一覧表示に切り替えました。')}};$('form').onsubmit=e=>{e.preventDefault();if($('end').value<$('start').value){alert('終了日は開始日以降にしてください');return}const id=$('eid').value||'custom'+Date.now();const item={id,name:$('name').value.trim(),game:$('game').value,start:$('start').value,end:$('end').value,kind:$('kind').value,url:$('url').value,done:$('done').checked};if(!item.name)return;events=events.filter(x=>x.id!==id).concat(item);$('dlg').close();save()};$('delete').onclick=()=>{if(confirm('このイベントを削除しますか？')){events=events.filter(x=>x.id!==$('eid').value);$('dlg').close();save()}};$('export').onclick=()=>{const blob=new Blob([JSON.stringify(events,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='game-events.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('import').onclick=()=>$('file').click();$('file').onchange=async e=>{try{const arr=JSON.parse(await e.target.files[0].text());if(!Array.isArray(arr)||!arr.every(x=>x.id&&games[x.game]&&x.name&&/^\d{4}-\d\d-\d\d$/.test(x.start)&&/^\d{4}-\d\d-\d\d$/.test(x.end)))throw Error();if(confirm('現在のデータを読み込んだデータで置き換えますか？')){events=arr;save()}}catch{alert('読み込めないJSONファイルです')}e.target.value=''};render();
</script></body></html>
